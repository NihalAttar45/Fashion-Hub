<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Contact - FashionHub</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-image: url(Images/pexels-negative-space-33999.jpg);
    background-position: top;
    background-size: cover;
    height: 100vh;
    width: 100%;

}

.container {
    width: 80%;
    margin: 0 auto;
    padding: 20px 0;
}

header {
    background-color: pink;
    color: black;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
}

.logo span {
    color: whitesmoke;
}

.menu {
    /* margin-top: 10px; */
    list-style: none;
    display: flex;
    padding-top: 5px;
    flex-direction: row;
}

.menu li {
    margin-right: 20px;
}

.menu a {
    color: black;
    text-decoration: none;
}

.contact-section {
    padding: 50px 0;
}

.contact-section h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.contact-content {
    max-width: 600px;
    margin: 0 auto;
}

.contact-content p {
    margin-bottom: 20px;
    color: #555;
}

form {
    display: grid;
    gap: 20px;
}

label {
    font-weight: bold;
}

input[type="text"],
input[type="email"],
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

button[type="submit"] {
    padding: 10px 20px;
    background-color: #333;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button[type="submit"]:hover {
    background-color: #00b894;
}

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <h1 class="logo" style="font-style: italic;">Shivanya<span style="font-weight: bolder;">Fashion...</span></h1>
                <ul class="menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="index.html">Categories</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <section class="contact-section">
        <div class="container">
            <h2 style="font-weight: bolder; font-size: xx-large; ;">Contact Us</h2>
            <div class="contact-content">
                <p style="color:#fff ;">If you have any questions or inquiries, feel free to contact us using the form below:</p>
                <form action="#" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    </section>

    </body>
</html>
